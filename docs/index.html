<script>
  // Pyxel Web はページ上のあらゆるエラーで全画面のエラー表示を出す。
  // 別オリジンのスクリプト（ブラウザ拡張・アプリ内ブラウザの注入スクリプトなど）の
  // エラーは中身が "Script error." としか見えず、ゲームとは無関係なことが多いので握りつぶす。
  // pyxel.js より先に登録して、Pyxel のハンドラに届かないようにする。
  window.addEventListener("error", (e) => {
    if (!e.error && (!e.message || e.message === "Script error.")) {
      console.warn("ignored opaque script error", e);
      e.stopImmediatePropagation();
    }
  }, true);
</script>
